# CI: build + fast tests for the C++ core, an end-to-end CLI smoke, the Python
# bindings, and an informational coverage summary.
#
# ubuntu-24.04 ships GCC 13 (the compiler this project is developed against)
# and a CMake well above the required 3.24. FetchContent cloning over HTTPS is
# fine on the runners (no local gitconfig URL rewrites here); build/_deps is
# cached keyed on CMakeLists.txt so the three pinned dependencies (ChessMG,
# Catch2, nlohmann/json) are only cloned when the pins change.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Lint/format/typecheck tool versions, pinned so the PR gate's ruleset can't
# change under a PR just because upstream shipped a release. This bit CI
# for real: `pip install ruff` unpinned picked up 0.16.1, whose default rule
# set is much larger than 0.15.x's, and 46 "errors" appeared on a tree
# nobody had touched (see ruff.toml for why none were defects; the fix there
# is an explicit `select`, which is a second, independent layer of defense --
# this pin is the first). clang-format is the most dangerous of the three: a
# new release can reformat code differently and fail format-check on lines
# nobody touched. Bump these deliberately, in a commit that also fixes
# whatever new findings the bump introduces -- never silently. Keep these in
# sync with the local dev versions; tests/repo/test_lint_tool_versions.py
# fails loudly if a contributor's local install drifts from what's pinned
# here (it parses this file, so it can't itself go stale).
env:
  RUFF_VERSION: "0.16.1"
  MYPY_VERSION: "1.19.1"
  CLANG_FORMAT_VERSION: "22.1.8"

jobs:
  cpp:
    name: C++ build, fast tests, CLI smoke
    runs-on: ubuntu-24.04
    env:
      CC: gcc-13
      CXX: g++-13
    steps:
      - uses: actions/checkout@v4

      - name: Install libzstd
        run: sudo apt-get update && sudo apt-get install -y libzstd-dev

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          # github.repository is in the key because FetchContent's *-subbuild
          # trees contain a CMakeCache.txt that records its own absolute path,
          # and the workspace path is /home/runner/work/<repo>/<repo>. Renaming
          # the repository therefore restored a cache built under the old path
          # into the new one, and CMake refused with "The current CMakeCache.txt
          # directory ... is different than the directory ... where CMakeCache.txt
          # was created". Keying on the repository makes any future rename miss
          # the cache and repopulate instead of failing the build.
          key: fetchcontent-${{ runner.os }}-${{ github.repository }}-${{ hashFiles('CMakeLists.txt', 'src/**/CMakeLists.txt') }}

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      # Catch2 cases tagged [slow] (full closures, tens of minutes) are already
      # excluded by catch_discover_tests' "~[slow]" spec — this is the same fast
      # suite `make test` runs. Deliberately sequential (no `ctest -j`): a known
      # shared-temp-dir race in test_probe.cpp only appears under parallel ctest.
      - name: Run fast test suite
        run: ctest --test-dir build --output-on-failure

      # Tiny end-to-end check with the real binary: generate the KQvk closure
      # into a temp dir, then probe the golden position from the README
      # (expected: dtm=2 (h#1) count=4).
      - name: End-to-end smoke (gen + probe)
        run: |
          TT="$(mktemp -d)"
          ./build/helpmate gen KQvk --tables "$TT"
          out="$(./build/helpmate probe "8/7k/5K2/8/8/8/8/6Q1 b - - 0 1" --tables "$TT")"
          echo "probe output: $out"
          echo "$out" | grep -F "dtm=2" | grep -F "count=4"

      # The v0.7.1 CMake split moved executables into subdirectories while
      # ctest kept passing, because ctest resolves target paths itself. Locally
      # a stale pre-split binary at the old path hid it for five tasks. Assert
      # the documented paths exist, so a future layout change fails loudly here
      # instead of silently everywhere else.
      - name: Binaries are at their documented paths
        run: |
          test -x build/helpmate       || { echo "build/helpmate missing"; exit 1; }
          test -x build/helpmate_tests || { echo "build/helpmate_tests missing"; exit 1; }

  python:
    name: Python bindings
    runs-on: ubuntu-24.04
    env:
      CC: gcc-13
      CXX: g++-13
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libzstd
        run: sudo apt-get update && sudo apt-get install -y libzstd-dev

      # scikit-build-core runs its own CMake configure (with -DHELPMATE_PYTHON=ON)
      # inside the pip build; FetchContent fetches the pinned deps over HTTPS.
      # helpmate-api requires helpmate, so the three distributions install in
      # dependency order.
      - name: Install all three distributions
        run: |
          python -m pip install .[dev]
          python -m pip install './src/packages/api[dev,verify]' './src/packages/web[dev]'

      # Slow tests (exhaustive KQvk cross-check, ~10 min) need --run-slow and
      # are skipped by default via src/packages/bindings/tests/conftest.py.
      # test_site_browser.py is excluded deliberately: it needs Chromium and a
      # rendered site, neither of which this job has, so here it would only
      # ever skip. It runs in the `ui` job, which has both. Ignoring it keeps
      # a real gate from hiding behind four silent skips.
      - name: Run Python tests
        run: |
          python -m pytest src/packages/bindings/tests src/packages/api/tests tests/repo -v \
            --ignore=tests/repo/test_site_browser.py

  ui:
    name: Dashboard (browser tests)
    runs-on: ubuntu-24.04
    env:
      CC: gcc-13
      CXX: g++-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # helpmate-api requires helpmate, so the three distributions install in
      # dependency order.
      # `pip install .[dev]` below runs the CMake configure, which hard-fails
      # without zstd headers. The runner image ships the zstd CLI but not the
      # dev package.
      - name: Install libzstd
        run: sudo apt-get update && sudo apt-get install -y libzstd-dev

      - name: Install all three distributions
        run: |
          python -m pip install .[dev]
          python -m pip install './src/packages/api[dev,verify]' './src/packages/web[dev]'

      # Browsers are cached; --with-deps installs the system libraries the
      # runner image lacks. The cache key follows the playwright version so a
      # driver bump re-downloads rather than using a stale browser.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('src/packages/web/pyproject.toml') }}
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      # `node --test src/packages/web/tests/js/` (a bare directory) discovers
      # nothing on Node 23 - it silently runs zero tests. `make jstest` is
      # what the local suite actually runs (globs *.test.js explicitly).
      - name: JS helper tests
        run: make jstest

      - name: Browser tests
        run: python -m pytest src/packages/web/tests/ui -v

      # The showcase's 302 material pages are git-ignored -- `make site`
      # renders them from the committed JSON in 0.15s. These run here rather
      # than alongside the other tests/repo tests because this is the only job
      # with Chromium installed, and they need the pages to exist at all.
      #
      # HELPMATE_REQUIRE_SITE turns a missing site from a skip into a failure.
      # Without it these four tests skip silently and the job still passes --
      # which is the exact bug they guard against, because a page whose boards
      # draw no pieces still renders and 404s nothing visible.
      - name: Generated showcase pages (browser)
        env:
          HELPMATE_REQUIRE_SITE: "1"
        run: |
          make site
          python -m pytest tests/repo/test_site_browser.py -v

  lint:
    name: Lint (ruff, node --check)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install "ruff==${{ env.RUFF_VERSION }}"
      # No ESLint: the dashboard is deliberately npm-free with no build step.
      # `make lint` is the single source of truth for both ruff and the JS
      # syntax gate (see the Makefile's `lint` target for why each file is
      # checked through a temp `.mjs` copy) so local runs and CI can't drift
      # apart again.
      - name: Lint
        run: make lint

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # mypy needs the server's own dependencies to resolve its imports, but
      # NOT the compiled `helpmate` extension -- ignore_missing_imports covers
      # that, and installing it would mean a ten-minute C++ build for a
      # type-check job.
      - name: Install typing dependencies
        run: python -m pip install "mypy==${{ env.MYPY_VERSION }}" fastapi uvicorn huggingface_hub
      - name: mypy
        run: python -m mypy

  cppformat:
    name: C++ format (changed lines)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # git-clang-format needs the merge base
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install clang-format
        run: python -m pip install "clang-format==${{ env.CLANG_FORMAT_VERSION }}"
      # A PR checkout's `origin/<base>` is not guaranteed to be a local ref
      # even with fetch-depth: 0 -- actions/checkout only configures a
      # refspec for the ref it checks out, so a plain `git fetch origin
      # main` lands in FETCH_HEAD without ever creating refs/remotes/
      # origin/main (verified in a single-branch scratch clone, which
      # reproduces that narrower default). Fetch with an explicit refspec so
      # the local origin/<base> ref actually exists, and the merge base
      # resolves instead of the job going green because BASE fell through to
      # a fallback that always exists (e.g. HEAD~1).
      - name: Check formatting of changed lines
        run: |
          BASE_REF="${{ github.base_ref || 'main' }}"
          git fetch origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          BASE="$(git merge-base "origin/$BASE_REF" HEAD)"
          make format-check BASE="$BASE"

  # Informational only: prints the gcovr line/function/branch summary in the
  # job log. No upload to any coverage service (no secrets configured).
  coverage:
    name: Coverage summary (informational)
    runs-on: ubuntu-24.04
    continue-on-error: true
    env:
      CC: gcc-13
      CXX: g++-13
    steps:
      - uses: actions/checkout@v4

      - name: Install libzstd
        run: sudo apt-get update && sudo apt-get install -y libzstd-dev

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          # github.repository is in the key because FetchContent's *-subbuild
          # trees contain a CMakeCache.txt that records its own absolute path,
          # and the workspace path is /home/runner/work/<repo>/<repo>. Renaming
          # the repository therefore restored a cache built under the old path
          # into the new one, and CMake refused with "The current CMakeCache.txt
          # directory ... is different than the directory ... where CMakeCache.txt
          # was created". Keying on the repository makes any future rename miss
          # the cache and repopulate instead of failing the build.
          key: fetchcontent-${{ runner.os }}-${{ github.repository }}-${{ hashFiles('CMakeLists.txt', 'src/**/CMakeLists.txt') }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gcovr
        run: python -m pip install gcovr

      # `make coverage` reuses the dependency sources under build/_deps via
      # FETCHCONTENT_FULLY_DISCONNECTED, so the normal build must run first.
      - name: Build (populates build/_deps for the coverage tree)
        run: make build

      - name: Coverage build, fast suite, gcovr summary
        run: make coverage GCOV=gcov-13
